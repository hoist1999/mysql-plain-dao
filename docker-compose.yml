services:
  mysql_test:
    image: mariadb:11.2
    container_name: mysql_test
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: test
    volumes:
      - ./src/__tests__/sql:/docker-entrypoint-initdb.d
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: [ "CMD", "mariadb-admin", "ping", "-h", "localhost", "-u", "root", "-proot" ]
      interval: 5s
      timeout: 5s
      retries: 20

  jest_test:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: jest_test
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
      - ./docker-logs:/root/.npm/_logs
    environment:
      - DB_HOST=mysql_test
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_DATABASE=test
      - DB_CONNECTION_LIMIT=10
      - DB_QUEUE_LIMIT=0
      - DB_WAIT_FOR_CONNECTIONS=true
      - NODE_ENV=test
    command: >
      sh -c "
        pnpm install &&
        pnpm test -- --verbose
      "
    depends_on:
      mysql_test:
        condition: service_healthy
